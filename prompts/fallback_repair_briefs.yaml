# Fresh scene seeds for replacing the 2026 fallback editions.
2026-07-27: An adult daughter and her retiring father repaint a municipal swimming-pool lane. A measured distance changes overnight; she must decide whether to accept his job.
2026-08-10: A stagehand finds that a rehearsal-room doorway leads to the scene an actor is refusing to perform. An unpaid apprentice wants the door left open.
2026-08-30: A locksmith and her estranged brother must cut a key whose teeth encode a sentence their father refused to say. The customer can hear the file but cannot read the cuts.
2026-08-31: A shuttle driver makes an unscheduled stop at a closed railway platform for an elderly regular. The passenger's abandoned luggage has been getting heavier for years.
2026-09-01: A dog groomer discovers that trimming a dog's coat changes the shape of its owner’s shadow. A regular customer asks for a cut the dog visibly resists.
2026-09-02: A supermarket produce display learns which fruit a night stocker hides for his unemployed sister. The display begins reserving fruit for someone he dislikes.
2026-09-03: An optician adjusts a widower's glasses and finds they let his grown son remember an argument from the other side. They disagree over which lens to replace.
2026-09-04: A gardener restoring an old public bath finds a surviving civilization the size of a seed tray. The irrigation schedule conflicts with their harvest.
2026-09-05: Two siblings repair a crawlspace pipe that secretly carries neighbors' favors instead of water. One needs a favor; the other has paid enough already.
2026-09-06: A mushroom farmer's growing substrate begins computing delivery routes. The best route would cut out the driver who taught her the business.
2026-09-07: A boatyard carpenter discovers that an unfinished hull answers questions through the grain of its wood. His customer wants an answer he has stopped asking his wife.
2026-09-08: A bakery apprentice keeps finding yesterday's birthday cake inside today's. The customer ordering it has been giving the same age for decades.
2026-09-09: A hiking guide rents a strip of land omitted from every map. Her mother wants to move there; she needs to know what an unmapped place can promise.
2026-09-10: A dentist's patient's oral bacteria arrange themselves into a working calendar. The patient asks to keep a date the dentist has been told to erase.
2026-09-11: A costume seller's counterfeit gloves give a buyer the dexterity of their supposed original owner. The seller must decide whether to admit the lie before an audition.
2026-09-12: A road-repair crew finds a pothole that consumes grudges instead of gravel. One worker refuses to let the crew fill it with an apology made on her behalf.
2026-09-13: A scooter mechanic houses a small god in a puncture-repair tin. It accepts exact change and favors customers who cannot afford a replacement tire.
2026-09-14: A seamstress has to hem a coat worn by two possible versions of one person. Each version wants the pocket on a different side for a different marriage.
2026-09-15: A cinema cleaner restores a discarded mechanical lantern that projects the occupants of seats removed during renovation. A former usher asks for his seat back.
2026-09-16: A secondhand computer seller recovers an old disk containing the revisions to a family recipe. Every deletion changes the taste of a soup simmering nearby.
2026-09-17: A groundskeeper suspects the heavy roller has become conscious because it refuses to flatten the pitch's worn footpaths. Her successor wants a flawless surface for the final match.
2026-09-18: A bicycle courier's repaired front wheel turns an hour behind the rear wheel. His sister asks him to deliver a birthday present before their latest quarrel.
2026-09-19: A butcher's cold-room door opens into the kitchen of another version of his family. Both families need the same last roast for Sunday dinner.
2026-09-20: A nursery worker must transplant a manufactured plant that has started choosing whose hands it will root in. The best candidate cannot pay the adoption fee.
2026-09-21: A laundromat attendant realizes a customer's stitches spell a secret only while wet. The customer needs the garment dry before her daughter arrives.
2026-09-22: A pigeon keeper in a disused tram depot finds the birds bringing back fares from a route that no longer exists. His niece wants to sell the depot tomorrow.
2026-09-23: A restaurant dishwasher finds that chipped plates reproduce the meal a diner meant to order. A colleague wants to use them to feed a family secretly.
2026-09-24: A theater's folding chairs begin allocating seats according to who has apologized to whom. An usher's brother arrives with two tickets and no apology.
2026-09-25: A ferryman discovers the knots in a borrowed rope hold memories of passengers' departures. His daughter asks him to untie one without knowing whose it is.
2026-09-26: A tile repairer finds an ancient city surviving between the layers of a kitchen floor. The tenant has one evening before the new refrigerator arrives.
2026-09-27: A bass player and a neighbor discover the basement heating pipes carry private performances between apartments. One person hears a rehearsal intended for somebody else.
2026-09-28: A fish-market ice maker begins growing nerve tissue that anticipates orders. The employee who cleans it must choose between an early sale and letting it rest.
2026-09-29: A piano tuner hears an unknown singer only in the notes she leaves slightly out of tune. A customer offers extra pay for perfect tuning before his daughter's recital.
2026-09-30: A barber's haircut contains a smaller haircut that can be undone independently. A divorced couple argues over their child's request for an asymmetrical fringe.
2026-10-01: A roofer finds a weather vane turning toward a home nobody has yet built. Her partner wants to sell the vacant lot it points to.
2026-10-02: A lift mechanic's repairs are undone whenever a resident tells a comforting lie about the building. The mechanic must make one resident feel secure enough to tell the truth.
2026-10-03: A street vendor sells imitation fruit that becomes real only after someone admits they were fooled. Her nephew needs lunch but cannot bear admitting his aunt deceived him.
2026-10-04: A swimming-pool lifeguard finds the deep end has been accepting promises as admission payment. A child wants her brother's promise refunded.
2026-10-05: A bowling-alley attendant hears a missing lane return through the pinsetter's knocks. Her father wants one last match with the team he abandoned.
